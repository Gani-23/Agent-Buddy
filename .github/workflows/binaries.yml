name: Build and release binaries
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.0.3 or v2.0.3"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare-release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          if [[ -z "$VERSION" ]]; then
            echo "Release version is required." >&2
            exit 1
          fi

          TAG="v$VERSION"
          CURRENT_SHA="$(git rev-parse HEAD)"

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_SHA" != "$CURRENT_SHA" ]]; then
              echo "Tag $TAG already exists at $TAG_SHA, not current commit $CURRENT_SHA." >&2
              exit 1
            fi
            echo "Using existing tag $TAG."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (${{ matrix.rid }})
    runs-on: windows-latest
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-release.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          dotnet publish -c Release -r $rid --self-contained true `
            -p:Version=$version -p:AssemblyVersion=$version.0 -p:FileVersion=$version.0 -p:InformationalVersion=$version
      - name: Zip artifact
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $publishDir = "bin/Release/net10.0/$rid/publish"
          $zipName = "AgentBuddy-$rid.zip"
          if (Test-Path $zipName) { Remove-Item $zipName }
          Compress-Archive -Path "$publishDir\\*" -DestinationPath $zipName
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBuddy-${{ matrix.rid }}
          path: AgentBuddy-${{ matrix.rid }}.zip

  build-macos:
    name: Build macOS (${{ matrix.rid }})
    runs-on: macos-latest
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          RID="${{ matrix.rid }}"
          dotnet publish -c Release -r "$RID" --self-contained true \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0" -p:InformationalVersion="$VERSION"
      - name: Build .app bundle
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          RID="${{ matrix.rid }}"
          APP_NAME="AgentBuddy"
          APP_DIR="$APP_NAME.app"
          PUBLISH_DIR="bin/Release/net10.0/$RID/publish"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$PUBLISH_DIR/AgentBuddy" "$APP_DIR/Contents/MacOS/AgentBuddy"
          chmod +x "$APP_DIR/Contents/MacOS/AgentBuddy"
          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>AgentBuddy</string>
            <key>CFBundleDisplayName</key>
            <string>AgentBuddy</string>
            <key>CFBundleIdentifier</key>
            <string>com.gani.agentbuddy</string>
            <key>CFBundleExecutable</key>
            <string>AgentBuddy</string>
            <key>CFBundleIconFile</key>
            <string>AgentBuddy</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          # Build icon from Assets/AgentBuddy.ico (if present)
          if [ -f "Assets/AgentBuddy.ico" ]; then
            ICON_PNG="/tmp/AgentBuddy.png"
            ICONSET="/tmp/AgentBuddy.iconset"
            sips -s format png "Assets/AgentBuddy.ico" --out "$ICON_PNG"
            mkdir -p "$ICONSET"
            sips -z 16 16   "$ICON_PNG" --out "$ICONSET/icon_16x16.png"
            sips -z 32 32   "$ICON_PNG" --out "$ICONSET/icon_16x16@2x.png"
            sips -z 32 32   "$ICON_PNG" --out "$ICONSET/icon_32x32.png"
            sips -z 64 64   "$ICON_PNG" --out "$ICONSET/icon_32x32@2x.png"
            sips -z 128 128 "$ICON_PNG" --out "$ICONSET/icon_128x128.png"
            sips -z 256 256 "$ICON_PNG" --out "$ICONSET/icon_128x128@2x.png"
            sips -z 256 256 "$ICON_PNG" --out "$ICONSET/icon_256x256.png"
            sips -z 512 512 "$ICON_PNG" --out "$ICONSET/icon_256x256@2x.png"
            sips -z 512 512 "$ICON_PNG" --out "$ICONSET/icon_512x512.png"
            sips -z 1024 1024 "$ICON_PNG" --out "$ICONSET/icon_512x512@2x.png"
            iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/AgentBuddy.icns"
          fi
      - name: Zip artifact
        run: |
          RID="${{ matrix.rid }}"
          ZIP_NAME="AgentBuddy-macos-$RID.zip"
          ditto -c -k --sequesterRsrc --keepParent "AgentBuddy.app" "$ZIP_NAME"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBuddy-macos-${{ matrix.rid }}
          path: AgentBuddy-macos-${{ matrix.rid }}.zip

  build-linux:
    name: Build Linux (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          RID="${{ matrix.rid }}"
          dotnet publish -c Release -r "$RID" --self-contained true \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION.0" -p:FileVersion="$VERSION.0" -p:InformationalVersion="$VERSION"
      - name: Tar artifact
        run: |
          RID="${{ matrix.rid }}"
          PUBLISH_DIR="bin/Release/net10.0/$RID/publish"
          TAR_NAME="AgentBuddy-$RID.tar.gz"
          tar -czf "$TAR_NAME" -C "$PUBLISH_DIR" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBuddy-${{ matrix.rid }}
          path: AgentBuddy-${{ matrix.rid }}.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-windows, build-macos, build-linux]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: AgentBuddy ${{ needs.prepare-release.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            ⚠️ **Unsigned Builds**
            These builds are unsigned, so Windows/macOS will show a warning the first time you open them.
            Follow the quick steps here:
            - https://github.com/Gani-23/Agent-Buddy/blob/main/docs/UNSIGNED_INSTALL.md
          files: |
            dist/AgentBuddy-win-x64/AgentBuddy-win-x64.zip
            dist/AgentBuddy-win-x86/AgentBuddy-win-x86.zip
            dist/AgentBuddy-macos-osx-arm64/AgentBuddy-macos-osx-arm64.zip
            dist/AgentBuddy-macos-osx-x64/AgentBuddy-macos-osx-x64.zip
            dist/AgentBuddy-linux-x64/AgentBuddy-linux-x64.tar.gz
            dist/AgentBuddy-linux-arm64/AgentBuddy-linux-arm64.tar.gz
